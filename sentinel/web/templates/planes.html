<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <title>Sentinel — Planes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='leaflet/leaflet.css') }}">
  <script src="{{ url_for('static', filename='leaflet/leaflet.js') }}"></script>
  <style>
    /* Shown full screen on a TV (Samsung's browser is Chrome 56: no flex gap, no CSS grid) */
    html, body { height: 100%; margin: 0; background: #000; color: #cfe; font-family: system-ui, sans-serif; }
    #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #050b0f; }
    #panel { position: absolute; left: 2vw; bottom: 3vh; z-index: 1000; max-width: 62vw; padding: 1.2vh 1.6vw;
             background: rgba(0, 10, 16, 0.88); border: 1px solid #16303a; border-radius: 14px; }
    .title { font-size: 2.4vh; color: #7fd6e8; margin-bottom: 0.4vh; }
    .row { font-size: 2.4vh; line-height: 1.45; color: #cde; }
    .row b { color: #fff; }
    .empty { font-size: 2.6vh; color: #8fb6c4; }
    .plane svg { display: block; }
    .leaflet-tooltip.tag { background: rgba(0, 0, 0, 0.72); color: #fff; border: 0; box-shadow: none; font-size: 1.8vh;
                           font-weight: 700; padding: 1px 6px; }
    .leaflet-tooltip.tag:before { display: none; }
    .leaflet-tooltip.tag.low { color: #ffd84d; }
    .leaflet-tooltip.tag.mil { color: #ff8f8f; }
    #flyby { position: absolute; top: 12px; right: 12px; z-index: 1000; padding: 8px 14px; border-radius: 10px; font-size: 15px;
             background: rgba(0, 10, 16, 0.86); border: 1px solid #0b6a7a; color: #8ff; cursor: pointer; font-family: inherit; }
    #flyby-said { position: absolute; top: 56px; right: 12px; z-index: 1000; max-width: min(340px, 80vw); padding: 8px 12px;
                  border-radius: 10px; background: rgba(0, 10, 16, 0.9); color: #cfe; font-size: 14px; line-height: 1.4; }
    #home-link { position: absolute; top: 12px; left: 12px; z-index: 1000; padding: 8px 14px; border-radius: 10px;
                 background: rgba(0, 10, 16, 0.86); border: 1px solid #16303a; color: #cfe; text-decoration: none; font-size: 15px; }
    @media (max-width: 700px) {  /* a phone */
      #panel { left: 8px; right: 8px; bottom: 8px; max-width: none; padding: 10px 12px; }
      .title { font-size: 15px; } .row { font-size: 14px; } .empty { font-size: 15px; }
      .leaflet-tooltip.tag { font-size: 12px; }
    }
    .leaflet-control-attribution { background: rgba(0,0,0,0.6) !important; color: #6aa !important; }
    .leaflet-control-attribution a { color: #8cc !important; }
  </style>
  <link rel="stylesheet" href="/static/roles.css?v=1">
</head>
<body data-role="{{ role }}">
  <div id="map"></div>
  <div id="panel"><div class="empty">Looking for planes…</div></div>
  <a id="home-link" href="/" hidden>← Home</a>
  <button id="flyby" type="button" hidden title="A random plane flies across the TVs' camera screens">✈️ Test fly-by</button>
  <div id="flyby-said" hidden></div>
  <script>
    var map = null, layers = null, me = null, centered = null;
    // A phone (not a TV) may share where it is: away from home, the map is of the planes over its owner
    var TV = /SMART-TV|Tizen|\bAFT[A-Z0-9]+\b|Web0S|webOS|BRAVIA/.test(navigator.userAgent);
    if (!TV && window.top === window) document.getElementById("home-link").hidden = false;  // (not inside the TV's page)
    // Test fly-by (from a phone or PC): a random plane flies across the TVs' camera page
    if (!TV && window.top === window) {
      var fb = document.getElementById("flyby"), said = document.getElementById("flyby-said"), saidTimer = null;
      fb.hidden = false;
      fb.onclick = function () {
        fb.disabled = true;
        fetch("/api/planes/flyby_demo", { method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json", "X-Sentinel-Request": "1" }, body: "{}" })
          .then(function (r) { return r.json(); })
          .then(function (d) { said.textContent = d.message || d.error || "Sent."; })
          .catch(function () { said.textContent = "Couldn't reach Sentinel."; })
          .then(function () {
            said.hidden = false; fb.disabled = false;
            clearTimeout(saidTimer); saidTimer = setTimeout(function () { said.hidden = true; }, 8000);
          });
      };
    }
    if (!TV && window.isSecureContext && navigator.geolocation) {
      navigator.geolocation.watchPosition(function (pos) {
        var first = !me;
        me = [pos.coords.latitude, pos.coords.longitude];
        if (first) load();
      }, function () {}, { enableHighAccuracy: false, maximumAge: 120000, timeout: 20000 });
    }
    // A plane seen from above, pointing up (north); turned to its heading
    var SHAPE = '<path d="M16 1 L19 12 L30 18 L30 21 L19 18 L18 26 L22 29 L22 31 L16 29.5 L10 31 L10 29 L14 26 L13 18 L2 21 L2 18 L13 12 Z"'
      + ' fill="FILL" stroke="#000" stroke-width="1.2"/>';

    function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

    function draw(data) {
      if (!map) {
        map = L.map("map", { zoomControl: false, keyboard: false, zoomAnimation: false, fadeAnimation: false });
        // (map pictures come through Sentinel, already dark: the TV's old browser was turned away by the map servers,
        // and drew CSS-filtered tiles black)
        L.tileLayer("/map_tile/dark/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap · planes: adsb.lol" }).addTo(map);
        layers = L.layerGroup().addTo(map);
      }
      var at = data.center || data.home;
      if (at && String(at) !== centered) {  // the house, or the phone's owner away from it (once, then as they move)
        // the whole circle the planes come from (radius in nautical miles)
        map.fitBounds(L.latLng(at).toBounds(data.radius_nm * 1852 * 2 * 0.8), { animate: false });
        centered = String(at);
      } else if (!at && centered === null) {
        map.setView([39.8, -98.6], 4);
        centered = "";
      }
      layers.clearLayers();
      if (data.home) {
        L.circleMarker(data.home, { radius: 8, color: "#fff", weight: 2, fillColor: "#00a8a8", fillOpacity: 1, interactive: false })
          .bindTooltip("Home", { permanent: true, direction: "right", offset: [10, 0], className: "tag" }).addTo(layers);
      }
      if (data.away && data.center) {
        L.circleMarker(data.center, { radius: 8, color: "#fff", weight: 2, fillColor: "#ff6bc1", fillOpacity: 1, interactive: false })
          .bindTooltip("You", { permanent: true, direction: "right", offset: [10, 0], className: "tag" }).addTo(layers);
      }
      var planes = data.planes || [];
      var labels = 0;
      planes.forEach(function (p) {
        var turn = p.track == null ? 0 : Math.round(p.track);
        var icon = L.divIcon({ className: "plane", iconSize: [32, 32], iconAnchor: [16, 16],
          html: '<svg width="32" height="32" viewBox="0 0 32 32" style="transform:rotate(' + turn + 'deg);-webkit-transform:rotate(' + turn + 'deg)">'
            + SHAPE.replace("FILL", p.military ? "#ff6b6b" : p.low ? "#ffd84d" : "#4de0ff") + "</svg>" });
        var pin = L.marker([p.lat, p.lon], { icon: icon, interactive: false }).addTo(layers);
        // labels on the closest flying ones only: around a big airport they piled up unreadably
        if (p.feet === "on the ground" || (++labels > 15 && !p.military)) return;
        pin.bindTooltip((p.military ? "military · " : "") + esc(p.tag) + (p.route ? " · " + esc(p.route) : "") + (p.feet ? " · " + esc(p.feet.replace(" feet up", " ft")) : ""),
                       { permanent: true, direction: "right", offset: [14, 0], className: "tag" + (p.military ? " mil" : p.low ? " low" : "") });
      });
      var rows = [];
      if (data.error) rows.push('<div class="empty">' + esc(data.error) + "</div>");
      else if (!planes.length) rows.push('<div class="empty">No planes nearby right now.</div>');
      else {
        rows.push('<div class="title">✈️ ' + planes.length + " plane" + (planes.length === 1 ? "" : "s") + (data.away ? " near you" : " near the house") + " · closest first</div>");
        planes.filter(function (p) { return p.feet !== "on the ground"; }).slice(0, 5)
          .forEach(function (p) { rows.push('<div class="row">' + esc(p.text) + "</div>"); });
      }
      document.getElementById("panel").innerHTML = rows.join("");
    }

    function load() {
      // (XMLHttpRequest: the TV's old browser leaves the sign-in cookie off fetch() calls)
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "/api/planes" + (me ? "?lat=" + me[0].toFixed(4) + "&lon=" + me[1].toFixed(4) : ""));
      xhr.onload = function () {
        if (xhr.status === 401) { location.reload(); return; }
        if (xhr.status !== 200) return;
        try { draw(JSON.parse(xhr.responseText)); } catch (e) {}
      };
      xhr.send();
    }
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
