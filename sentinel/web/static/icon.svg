<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 40 500 500">
  <!-- Sentinel mark (from Sentinel.svg) on a dark tile; strokes thickened to stay legible at 16-32 px. -->
  <defs>
    <path id="arrow" d="M 240,100 C 180,100 120,140 120,200 C 120,260 180,300 240,300 L 220,320 L 270,300 L 220,280 L 240,300
             C 190,300 140,270 140,200 C 140,130 190,120 240,120 L 260,140 L 210,120 L 260,100 Z"/>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="-50" y="40" width="500" height="500" rx="96" fill="#001525"/>
  <g fill="#00e5ff" stroke="#00e5ff" stroke-width="14" stroke-linejoin="round" filter="url(#glow)">
    <use href="#arrow" transform="translate(0,100) translate(200,150) scale(1,-1) translate(-200,-150)"/>
    <use href="#arrow" transform="translate(0,180) translate(200,150) scale(-1,1) translate(-200,-150)"/>
  </g>
</svg>
