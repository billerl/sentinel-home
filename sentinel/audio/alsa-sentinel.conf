# Sentinel Home: the PC's line-out jack, shared by Sentinel's voice/alerts and Spotify (spotifyd).
# The bare hardware device plays one stream at a time; dmix mixes them so Jezebel can talk over music.
# Loaded only by Sentinel and its players: ALSA_CONFIG_PATH=/usr/share/alsa/alsa.conf:<this file>.
pcm.sentinel_mix {
    type dmix
    ipc_key 51515
    ipc_perm 0660
    slave {
        pcm "hw:PCH,0"
        rate 48000
        channels 2
        format S16_LE
        period_size 1024
        buffer_size 8192
    }
}
# Voice, chimes and alerts.
pcm.sentinel_speaker {
    type plug
    slave.pcm "sentinel_mix"
}
# Music: its own volume ("Sentinel Music" on card 0), turned down while the voice assistant talks.
pcm.sentinel_music {
    type plug
    slave.pcm {
        type softvol
        slave.pcm "sentinel_mix"
        control {
            name "Sentinel Music"
            card PCH
        }
    }
}
